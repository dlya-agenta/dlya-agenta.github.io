<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdnjs.cloudflare.com https://telegram.org; style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: https://arojogajdamsyrrpcmso.supabase.co https://zpkqduhbymvadtwgcyhp.supabase.co https://*.tile.openstreetmap.org https://cdnjs.cloudflare.com https://*.ru; connect-src 'self' https://arojogajdamsyrrpcmso.supabase.co/functions/v1/; frame-src tg:; object-src 'none'; base-uri 'self'; form-action 'self'">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Объекты от собственников Сочи</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231453d8'/%3E%3Cpath d='M14 34 32 18l18 16v14H38V38H26v10H14z' fill='white'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.Default.min.css">
<link rel="stylesheet" href="style.css?v=5.7">
<script src="design.js?v=5.5"></script>
<link rel="stylesheet" href="offer.css?v=5.8">
<script src="https://telegram.org/js/telegram-web-app.js?59"></script>
</head>
<body>
<div id="gate" class="gate"><div class="spinner"></div><p>Загрузка…</p></div>

<div id="app" hidden>
  <header class="top">
    <div class="brand">
      <span class="logo" aria-hidden="true"><svg viewBox="0 0 64 64"><rect width="64" height="64" rx="14"/><path d="M14 34 32 18l18 16v14H38V38H26v10H14z"/></svg></span>
      <span><b>Для Агента</b><small>5 минут — вместо тысячи часов!</small></span>
    </div>
    <nav class="menu" id="menu">
      <button class="link on" data-go="all" aria-current="page"><span class="lbl-long">🏠 Все объявления</span><span class="lbl-short">🏠 Все</span></button>
      <button class="link" data-go="favs">★ Избранное</button>
      <button class="link agent-only" data-go="deals" hidden>🤝 Контакт</button>
      <button class="link agent-only" data-go="sels"><span class="lbl-long">📄 Мои подборки</span><span class="lbl-short">📄 Подборки</span></button>
      <button class="link agent-only" data-go="rk" id="go-rk">📣 Реклама</button>
      <button class="link agent-only" data-go="mail" id="go-mail">✉️ Рассылки</button>
      <button class="link agent-only" data-go="arch" id="go-arch"><span class="lbl-long">🗂 Архив 2 года</span><span class="lbl-short">🗂 Архив</span></button>
      <button class="link client-btn" data-go="client" id="go-client">👤 С клиентом</button>
      <button class="link agent-only" data-go="admin" id="go-admin" hidden>⚙ Админ</button>
      <button class="link" data-go="pay" id="go-pay" hidden>Продлить доступ</button>
      <button type="button" class="link" data-style id="go-style">🎨 Стиль</button>
      <button class="link" id="logout" hidden>Выйти</button>
    </nav>
    <button class="who" data-go="prof" id="go-prof" title="Профиль: тариф, номера, контакты, устройства"><span id="who"></span><small id="until"></small><small id="quota" class="agent-only" hidden></small></button>
    <button type="button" class="burger" id="burger" aria-expanded="false" aria-controls="menu">☰ Меню</button>
  </header>

  <main>
    <form id="qform" class="search">
      <div class="qbox"><input id="q" type="search" placeholder="Улица, дом, ЖК или «2к до 15 млн Мамайка»" autocomplete="off" enterkeyhint="search" aria-label="Поиск: улица, дом, ЖК, район или запрос словами"></div>
      <button type="submit" class="btn primary">Найти</button>
      <button type="button" class="btn ghost" id="toggle-f">Фильтры <span id="fcount"></span></button>
    </form>
    <div class="chips q-place" id="q-place"></div>

    <section id="filters" class="filters closed" aria-label="Фильтры">
      <div class="fhead"><b>Фильтры</b><button type="button" class="x" id="f-close" aria-label="Закрыть фильтры">✕</button></div>
      <div class="fside-row"><button type="button" class="link" id="f-side" title="Где показывать фильтр: колонкой слева или блоком сверху">⇦ Фильтр слева</button></div>
      <div class="fcols">
        <div class="fcol">
          <div class="fcell"><div class="fl" data-h="kind">Тип недвижимости</div><div class="chips" id="f-kind"></div></div>
          <div class="fcell"><div class="fl" data-h="rooms">Комнаты</div><div class="chips" id="f-rooms"></div></div>
          <div class="fcell"><div class="fl" data-h="area">Площадь, м²</div>
            <div class="pair"><input id="amin" type="number" min="0" placeholder="от" inputmode="numeric"><span>—</span><input id="amax" type="number" min="0" placeholder="до" inputmode="numeric"></div></div>
          <div class="fcell"><div class="fl" data-h="price">Цена, ₽</div>
            <div class="pair"><input id="pmin" type="text" placeholder="от" inputmode="numeric" autocomplete="off"><span>—</span><input id="pmax" type="text" placeholder="до" inputmode="numeric" autocomplete="off"></div></div>
          <div class="fcell"><div class="fl" data-h="place">Район и ЖК</div>
            <div class="chips"><button type="button" class="chip pick-btn" id="open-areas">Район</button><button type="button" class="chip pick-btn" id="open-zk">ЖК</button></div></div>
          <div class="fcell"><div class="fl" data-h="sea">До моря (по прямой)</div><select id="sea" aria-label="Расстояние до моря по прямой"></select></div>
        </div>
        <div class="fcol">
          <div class="fcell"><div class="fl" data-h="floor">Этаж</div>
            <div class="pair"><input id="fmin" type="number" min="1" placeholder="от" inputmode="numeric"><span>—</span><input id="fmax" type="number" min="1" placeholder="до" inputmode="numeric"></div>
            <div class="checks"><label><input type="checkbox" id="nf"> не первый</label><label><input type="checkbox" id="nl"> не последний</label></div></div>
          <div class="fcell"><div class="fl" data-h="fin">Отделка</div><div class="chips" id="f-fin"></div></div>
          <div class="fcell"><div class="fl" data-h="flags">Дом и объявление</div><div class="chips" id="f-flags"></div></div>
          <div class="fcell agent-only"><div class="fl" data-h="ext">Собственники напрямую с площадок</div><div class="chips" id="f-ext"></div></div>
          <div class="fcell"><div class="fl" data-h="sort">Сортировка</div>
            <select id="sort" aria-label="Сортировка">
              <option value="new">Сначала новые</option>
              <option value="price">Сначала дешевле</option>
              <option value="price_desc">Сначала дороже</option>
              <option value="area_desc">Больше площадь</option>
            </select></div>
        </div>
      </div>
      <div class="ffoot">
        <div id="f-drop" class="fdrop" hidden></div>
        <button type="button" class="btn ghost" id="reset">Сбросить всё</button>
        <button type="button" class="btn primary" id="apply">Показать</button>
      </div>
    </section>

    <div class="bar">
      <p id="status" class="status muted"></p>
      <div class="bar-r">
        <div class="views" id="layouts" title="Сколько объявлений на экране"><button class="seg ic" data-lay="3" title="3 объявления на экране">▥ 3</button><button class="seg ic" data-lay="6" title="6 объявлений на экране, миниатюры">▦ 6</button></div>
        <div class="views"><button class="seg on" data-view="list" aria-current="true">Список</button><button class="seg" data-view="map" id="go-map">Карта</button></div>
      </div>
    </div>

    <section id="list" class="list"></section>
    <button id="more" class="btn more" hidden>Показать ещё</button>
    <div id="map" class="map" hidden></div>
    <section id="maplist" class="maplist" hidden>
      <div class="ml-head"><b id="ml-count"></b>
        <select id="ml-sort" aria-label="Сортировка списка">
          <option value="new">Сначала новые</option><option value="price">Сначала дешевле</option>
          <option value="price_desc">Сначала дороже</option><option value="area_desc">Больше площадь</option>
        </select></div>
      <div id="ml-items" class="ml-items"></div>
      <button id="ml-more" class="btn more" hidden>Показать ещё</button>
    </section>
  </main>

  <footer class="foot">
    <a href="prices.html" target="_blank">Тарифы</a> · <a href="oferta.html" target="_blank">Договор-оферта</a> ·
    <a href="rules.html" target="_blank">Правила</a> · <a href="privacy.html" target="_blank">Политика конфиденциальности</a>
  </footer>

  <div id="selbar" class="selbar" hidden>
    <span id="selcount"></span>
    <button class="btn ghost" id="sel-clear">Очистить</button>
    <button class="btn primary" id="sel-make">Сформировать PDF</button>
  </div>
</div>

<div id="sheet" class="sheet" hidden>
  <div class="sheet-box" role="dialog" aria-modal="true">
    <div class="sheet-head"><b id="sheet-title"></b><button class="x" data-close aria-label="Закрыть">✕</button></div>
    <div id="sheet-body" class="sheet-body"></div>
  </div>
</div>

<div id="viewer" class="viewer" hidden><button class="viewer-close" aria-label="Закрыть">✕</button>
  <button class="viewer-nav l" data-vnav="-1" aria-label="Предыдущее фото">‹</button><button class="viewer-nav r" data-vnav="1" aria-label="Следующее фото">›</button>
  <div class="viewer-strip"></div><div class="viewer-count"></div></div>
<div id="toast" class="toast" hidden></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js" defer></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/leaflet.markercluster.min.js" defer></script>
<script src="config.js"></script>
<script src="filters.js?v=5.2" defer></script>
<script src="suggest.js?v=5.2.1" defer></script>
<script src="offer.js?v=5.8" defer></script>
<script src="plans.js?v=5.8" defer></script>
<script src="mfa.js?v=5.7" defer></script>
<script src="admin.js?v=5.7" defer></script>
<script src="guest.js?v=5.6.1" defer></script>
<script src="partner.js?v=5.6" defer></script>
<script src="profile.js?v=5.6" defer></script>
<script src="app.js?v=5.7" defer></script>
</body>
</html>
